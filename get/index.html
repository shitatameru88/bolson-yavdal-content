<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sodonnews</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:#0E0E12;color:#eaeaea;display:flex;min-height:100vh;
       align-items:center;justify-content:center;text-align:center}
  .box{padding:24px;max-width:340px}
  a{color:#e2474d;font-weight:700;text-decoration:none}
  .small{opacity:.7;font-size:14px;margin-top:16px}
</style>
</head>
<body>
  <div class="box">
    <p>Sodonnews нээгдэж байна… 👻</p>
    <p class="small"><a id="fallback"
      href="https://play.google.com/store/apps/details?id=mn.bolson.bolson_yavdal">
      Автоматаар нээгдэхгүй бол энд дарна уу</a></p>
  </div>
<script>
(function () {
  var play = "https://play.google.com/store/apps/details?id=mn.bolson.bolson_yavdal";
  var ios  = "https://apps.apple.com/app/id6782537722";
  var ua = (navigator.userAgent || "").toLowerCase();
  var dest = /iphone|ipad|ipod/.test(ua) ? ios : play; // Android + desktop -> Play
  var fb = document.getElementById("fallback");
  if (fb) fb.href = dest;         // make the manual link match the device too
  location.replace(dest);         // instant auto-redirect
})();
</script>
</body>
</html>
