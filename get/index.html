<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sodonnews</title>
<!-- GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3PS7HDFLL3"></script>
<style>
  html,body{margin:0;height:100%}
  a.wrap{display:flex;min-height:100vh;flex-direction:column;
         align-items:center;justify-content:center;text-align:center;
         background:#0E0E12;color:#eaeaea;text-decoration:none;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:24px;-webkit-tap-highlight-color:transparent}
  .ghost{font-size:56px;line-height:1;margin-bottom:20px}
  .btn{background:#e2474d;color:#fff;font-weight:800;font-size:21px;
       padding:16px 30px;border-radius:14px}
  .sub{opacity:.7;font-size:15px;margin-top:20px}
</style>
</head>
<body>
  <!-- Whole page is a tap target: any tap navigates to the correct store,
       which works even in webviews (Messenger) that block auto-redirects. -->
  <a id="go" class="wrap"
     href="https://play.google.com/store/apps/details?id=mn.bolson.bolson_yavdal">
    <div class="ghost">👻</div>
    <div class="btn">📲 Sodonnews нээх</div>
    <div class="sub">Дэлгэц дээр дарна уу</div>
  </a>
<script>
(function () {
  var play = "https://play.google.com/store/apps/details?id=mn.bolson.bolson_yavdal";
  var ios  = "https://apps.apple.com/app/id6782537722";
  var ua = (navigator.userAgent || "").toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua);
  var isAndroid = /android/.test(ua);
  var dest = isIOS ? ios : play;                        // Android + desktop -> Play
  var platform = isIOS ? "ios" : (isAndroid ? "android" : "desktop");
  var store = isIOS ? "app_store" : "play";
  var go = document.getElementById("go");
  if (go) go.href = dest;                               // whole-page tap -> store

  // --- GA4: count the hit + log which store, before redirecting ---
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-3PS7HDFLL3', { transport_type: 'beacon' });

  var done = false;
  function goNow(){ if (!done){ done = true; window.location.replace(dest); } }
  gtag('event', 'store_redirect', {
    app: 'bolson', store: store, platform: platform,
    transport_type: 'beacon',      // sends reliably even as we navigate away
    event_callback: goNow
  });
  setTimeout(goNow, 700);          // fallback if the callback is slow/blocked
  // Messenger blocks auto-redirect: first tap anywhere navigates (hit already logged)
  document.addEventListener('click', function(){ window.location.href = dest; }, { once: true });
})();
</script>
</body>
</html>
